  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #map { width: 100vw; height: 100vh; }

    #header {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(255,255,255,0.93);
      color: #1a1a1a; padding: 12px 22px; border-radius: 12px;
      text-align: center; backdrop-filter: blur(8px);

    #header .sub { font-size: 12px; color: #555; margin-top: 3px; }
    #header .sub span { color: #666; margin: 0 6px; }

    #legend {
      position: absolute; bottom: 28px; right: 12px; z-index: 1000;
      background: rgba(255,255,255,0.93); color: #333;
      padding: 14px 16px; border-radius: 12px; font-size: 12px;
      border: 1px solid rgba(0,0,0,0.10);
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    #legend h3 { font-size: 12px; color: #666; text-transform: uppercase;
      letter-spacing: 0.8px; margin-bottom: 10px; }
    .leg { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    .leg-line { width: 28px; height: 3px; border-radius: 2px; flex-shrink: 0; }

    .leaflet-popup-content-wrapper {
      background: rgba(255,255,255,0.98) !important;
      color: #1a1a1a !important;
      border: 1px solid rgba(0,0,0,0.12) !important;
      border-radius: 10px !important;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15) !important;
      backdrop-filter: blur(10px);
    }
    .leaflet-popup-tip { background: rgba(255,255,255,0.98) !important; }
    .leaflet-popup-content { margin: 12px 16px !important; }
    .popup-name { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 2px; }
    .popup-city { font-size: 12px; color: #555; }
    .popup-date { font-size: 11px; color: #2a7ab8; margin-top: 5px; }
    .popup-night { font-size: 11px; color: #e8a44a; font-weight: 600; }

    .mi { font-size: 20px; line-height: 1; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.30)); cursor: pointer; }
    .mi-hotel { font-size: 24px; }
    .mi-special { font-size: 22px; }
    .mi-radio { font-size: 20px; }
    .mi-landmark { font-size: 20px; }

const map = L.map('map', {
  zoomControl: true,
  attributionControl: true,
}).setView([35.5, -88], 5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors &copy; <a href="https://carto.com">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);

// Route — single merged polyline from fixed KML
L.polyline(ROUTE, {
  color: '#4a8fd4',
  weight: 2.5,
  opacity: 0.75,
  lineJoin: 'round',
}).addTo(map);

const buceesIcon = L.icon({
  iconUrl: BUCEES_IMG,
  iconSize: [36, 36],
  iconAnchor: [18, 18],
  popupAnchor: [0, -18],
});

function makeIcon(ci) {
  if (ci.type === 'bucees') return buceesIcon;
  const cls = ci.type === 'hotel' ? 'mi mi-hotel'
            : ci.type === 'special' ? 'mi mi-special'
            : ci.type === 'radio' ? 'mi mi-radio'
            : 'mi';
  return L.divIcon({
    className: '',
    html: `<span class="${cls}">${ci.icon}</span>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -14],
  });
}

CHECKINS.forEach(ci => {
  const icon = makeIcon(ci);
  const popup = `
    <div class="popup-name">${ci.type === 'bucees' ? '🦫' : ci.icon} ${ci.name}</div>
    <div class="popup-city">${ci.city}</div>
    <div class="popup-date">${ci.date}</div>
    ${ci.night ? `<div class="popup-night">🌙 ${ci.night}</div>` : ''}
  `;
  L.marker([ci.lat, ci.lon], {icon})
    .bindPopup(popup, {maxWidth: 220})
    .addTo(map);
});


const bounds = L.latLngBounds(ROUTE);
map.fitBounds(bounds, {padding: [60, 60]});
