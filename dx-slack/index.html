<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM DX Slack Archives</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --text: #e2e8f0;
    --muted: #8892a4;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--text); }
  header h1 span { color: var(--accent); }
  .badge { background: var(--accent2); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; }

  .stats-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); }
  .stat { padding: 10px 20px; border-right: 1px solid var(--border); }
  .stat-val { font-size: 16px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .controls { padding: 14px 24px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px 8px 36px; border-radius: 6px; font-size: 14px; outline: none; transition: border-color .15s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  .channels { display: flex; gap: 6px; flex-wrap: wrap; }
  .ch-btn { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
  .ch-btn:hover { border-color: var(--accent); color: var(--text); }
  .ch-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .date-wrap { display: flex; gap: 8px; align-items: center; }
  .date-wrap input[type=date] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: none; }
  .date-wrap input[type=date]:focus { border-color: var(--accent); }
  .date-wrap span { color: var(--muted); font-size: 12px; }

  .clear-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .clear-btn:hover { color: var(--text); border-color: var(--text); }

  .results-header { padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .results-count { color: var(--muted); font-size: 13px; }
  .results-count strong { color: var(--text); }
  .sort-wrap { display: flex; gap: 4px; }
  .sort-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .sort-btn.active { color: var(--accent); border-color: var(--accent); }

  #messages { padding: 0 24px 24px; }

  .msg { border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; background: var(--surface); overflow: hidden; }
  .msg-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); }
  .msg-avatar { width: 28px; height: 28px; border-radius: 6px; background: var(--accent2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .msg-meta { flex: 1; min-width: 0; }
  .msg-name { font-weight: 600; font-size: 13px; }
  .msg-time { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .ch-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
  .ch-tag.e-skip    { background: #1e3a5f; color: #60a5fa; }
  .ch-tag.tropo     { background: #1a3325; color: #4ade80; }
  .ch-tag.meteorscatter { background: #3b1f4a; color: #c084fc; }
  .ch-tag.au        { background: #3b2a1a; color: #fb923c; }
  .ch-tag.dx-rewind { background: #2a1a1a; color: #f87171; }

  .msg-body { padding: 10px 14px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; font-size: 13px; }
  .msg-body a { color: var(--accent); text-decoration: none; }
  .msg-body a:hover { text-decoration: underline; }
  .msg-body code { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; font-family: monospace; font-size: 12px; }
  .msg-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-top: 6px; overflow-x: auto; }
  .msg-body pre code { background: none; border: none; padding: 0; }
  .highlight { background: #854d0e44; color: #fbbf24; border-radius: 2px; padding: 0 1px; }
  .thread-badge { font-size: 11px; color: var(--muted); padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; }

  .pagination { display: flex; gap: 6px; justify-content: center; padding: 20px 24px; }
  .page-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; min-width: 36px; }
  .page-btn:hover { border-color: var(--accent); color: var(--text); }
  .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .loading { text-align: center; padding: 60px 24px; color: var(--muted); }
  .loading-bar { width: 200px; height: 4px; background: var(--border); border-radius: 2px; margin: 16px auto 0; overflow: hidden; }
  .loading-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { width: 20%; margin-left: 0; } 50% { width: 60%; margin-left: 20%; } }

  .empty { text-align: center; padding: 60px 24px; color: var(--muted); }
  .empty svg { opacity: .3; margin-bottom: 12px; }

  @media (max-width: 640px) {
    .stats-bar { flex-wrap: wrap; }
    .controls { flex-direction: column; align-items: stretch; }
    .date-wrap { flex-wrap: wrap; }
    header h1 { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <rect width="28" height="28" rx="6" fill="#4f8ef7" opacity=".15"/>
    <path d="M8 14 Q14 6 20 14 Q14 22 8 14Z" fill="#4f8ef7"/>
  </svg>
  <h1>FM DX Slack <span>Archives</span></h1>
  <span class="badge">W2NJL Group</span>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="stat-val" id="statMsgs">—</div><div class="stat-label">Messages</div></div>
  <div class="stat"><div class="stat-val" id="statChannels">—</div><div class="stat-label">Channels</div></div>
  <div class="stat"><div class="stat-val" id="statEarliest">—</div><div class="stat-label">Earliest</div></div>
  <div class="stat"><div class="stat-val" id="statLatest">—</div><div class="stat-label">Latest</div></div>
  <div class="stat"><div class="stat-val" id="statUpdated">—</div><div class="stat-label">Generated</div></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search messages…" autocomplete="off" spellcheck="false">
  </div>

  <div class="channels" id="channelBtns">
    <button class="ch-btn active" data-ch="all">All Channels</button>
    <button class="ch-btn" data-ch="e-skip">E-Skip</button>
    <button class="ch-btn" data-ch="tropo">Tropo</button>
    <button class="ch-btn" data-ch="meteorscatter">Meteor Scatter</button>
    <button class="ch-btn" data-ch="au">AU DX</button>
    <button class="ch-btn" data-ch="dx-rewind">DX Rewind</button>
  </div>

  <div class="date-wrap">
    <input type="date" id="dateFrom" title="From date">
    <span>→</span>
    <input type="date" id="dateTo" title="To date">
  </div>

  <button class="clear-btn" id="clearBtn">Clear filters</button>
</div>

<div class="results-header">
  <div class="results-count" id="resultsCount">Loading…</div>
  <div class="sort-wrap">
    <button class="sort-btn active" id="sortNew">Newest</button>
    <button class="sort-btn" id="sortOld">Oldest</button>
  </div>
</div>

<div id="messages">
  <div class="loading">
    <div style="font-size:15px;font-weight:600;">Loading archive…</div>
    <div style="font-size:12px;margin-top:6px;color:var(--muted)">Fetching 126k messages</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>
</div>

<div class="pagination" id="pagination"></div>

<script>
let allMessages = [];
let users = {};
let filtered = [];
let currentPage = 1;
let sortNewest = true;
const PAGE_SIZE = 50;

const CHANNEL_LABELS = {
  'e-skip': 'E-Skip',
  'tropo': 'Tropo',
  'meteorscatter': 'Meteor Scatter',
  'au': 'AU DX',
  'dx-rewind': 'DX Rewind'
};

// ── Load stats.json first (tiny, fast) ──────────────────────────────
fetch('stats.json')
  .then(r => r.json())
  .then(s => {
    document.getElementById('statMsgs').textContent = s.total_messages.toLocaleString();
    document.getElementById('statChannels').textContent = s.channels.length;
    document.getElementById('statEarliest').textContent = s.date_range.earliest ? fmtDate(s.date_range.earliest) : '—';
    document.getElementById('statLatest').textContent = s.date_range.latest ? fmtDate(s.date_range.latest) : '—';
    document.getElementById('statUpdated').textContent = fmtDate(s.generated_at);
  }).catch(() => {});

// ── Load full data ───────────────────────────────────────────────────
fetch('slack_data.json')
  .then(r => r.json())
  .then(data => {
    users = data.users || {};
    allMessages = (data.messages || []).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    applyFilters();
  })
  .catch(err => {
    document.getElementById('messages').innerHTML = `<div class="empty"><p>Failed to load data: ${err.message}</p></div>`;
  });

// ── Filtering ────────────────────────────────────────────────────────
let debounceTimer;
function applyFilters() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const ch = document.querySelector('.ch-btn.active')?.dataset.ch || 'all';
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;

  filtered = allMessages.filter(m => {
    if (ch !== 'all' && m.channel !== ch) return false;
    if (from && m.date < from) return false;
    if (to && m.date > to) return false;
    if (query && !m.text.toLowerCase().includes(query) && !m.user_name.toLowerCase().includes(query)) return false;
    return true;
  });

  if (!sortNewest) filtered = [...filtered].reverse();

  currentPage = 1;
  renderResults(query);
}

// ── Rendering ────────────────────────────────────────────────────────
function renderResults(query = '') {
  const total = filtered.length;
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);

  document.getElementById('resultsCount').innerHTML =
    `<strong>${total.toLocaleString()}</strong> results${query ? ` for "<em>${escHtml(query)}</em>"` : ''}`;

  if (total === 0) {
    document.getElementById('messages').innerHTML = `
      <div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <p>No results found.</p>
        <p style="font-size:12px;margin-top:4px;">Try different search terms or filters.</p>
      </div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  document.getElementById('messages').innerHTML = page.map(m => renderMsg(m, query)).join('');
  renderPagination(total);
}

function renderMsg(m, query) {
  const initials = (m.user_name || '?').slice(0, 2).toUpperCase();
  const color = colorForName(m.user_name);
  const chLabel = CHANNEL_LABELS[m.channel] || m.channel;
  const dt = new Date(m.timestamp);
  const timeStr = dt.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const body = formatText(m.text, query);
  const isThread = m.is_thread_reply;

  return `<div class="msg">
    <div class="msg-head">
      <div class="msg-avatar" style="background:${color}">${initials}</div>
      <div class="msg-meta">
        <div class="msg-name">${escHtml(m.user_name || 'Unknown')}</div>
        <div class="msg-time">${timeStr}</div>
      </div>
      <span class="ch-tag ${m.channel}">${chLabel}</span>
      ${isThread ? '<span class="thread-badge">thread reply</span>' : ''}
    </div>
    <div class="msg-body">${body}</div>
  </div>`;
}

function renderPagination(total) {
  const pages = Math.ceil(total / PAGE_SIZE);
  if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }

  const maxVisible = 7;
  let btns = '';

  btns += `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

  let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
  let end = Math.min(pages, start + maxVisible - 1);
  if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

  if (start > 1) btns += `<button class="page-btn" onclick="goPage(1)">1</button>${start > 2 ? '<span style="color:var(--muted);padding:0 4px">…</span>' : ''}`;
  for (let i = start; i <= end; i++) {
    btns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  if (end < pages) btns += `${end < pages - 1 ? '<span style="color:var(--muted);padding:0 4px">…</span>' : ''}<button class="page-btn" onclick="goPage(${pages})">${pages}</button>`;

  btns += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}>›</button>`;
  document.getElementById('pagination').innerHTML = btns;
}

window.goPage = function(n) {
  if (n < 1 || n > Math.ceil(filtered.length / PAGE_SIZE)) return;
  currentPage = n;
  renderResults(document.getElementById('searchInput').value.trim().toLowerCase());
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

// ── Text formatting ──────────────────────────────────────────────────
function formatText(text, query) {
  if (!text) return '';

  // HTML entities first
  text = text.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');

  // Code blocks (before other formatting)
  text = text.replace(/```([^`]*)```/gs, (_, code) => `<pre><code>${escHtml(code.trim())}</code></pre>`);

  // Escape remaining HTML (outside code blocks)
  // We split on pre blocks to not double-escape
  text = text.split(/(<pre>.*?<\/pre>)/s).map((part, i) => {
    if (i % 2 === 1) return part; // already a code block
    return escHtml(part)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*([^*]+)\*/g, '<strong>$1</strong>')
      .replace(/_([^_]+)_/g, '<em>$1</em>')
      .replace(/~([^~]+)~/g, '<del>$1</del>')
      // Slack user mentions
      .replace(/&lt;@([A-Z0-9]+)&gt;/g, (_, uid) => {
        const u = users[uid];
        const name = u ? (u.display_name || u.real_name || u.name || uid) : uid;
        return `<span style="color:var(--accent);font-weight:600">@${escHtml(name)}</span>`;
      })
      // URLs
      .replace(/&lt;(https?:\/\/[^|&>]+)\|([^&>]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>')
      .replace(/&lt;(https?:\/\/[^&>]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }).join('');

  // Highlight search query
  if (query) {
    const re = new RegExp(`(${escRe(query)})`, 'gi');
    text = text.replace(re, '<mark class="highlight">$1</mark>');
  }

  return text;
}

// ── Utilities ────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  catch { return iso; }
}
function colorForName(name) {
  const colors = ['#4f8ef7','#7c3aed','#059669','#dc2626','#d97706','#0891b2','#be185d','#65a30d'];
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
  return colors[Math.abs(h) % colors.length];
}

// ── Event listeners ──────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(applyFilters, 250);
});

document.getElementById('channelBtns').addEventListener('click', e => {
  const btn = e.target.closest('.ch-btn');
  if (!btn) return;
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
});

document.getElementById('dateFrom').addEventListener('change', applyFilters);
document.getElementById('dateTo').addEventListener('change', applyFilters);

document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-ch="all"]').classList.add('active');
  applyFilters();
});

document.getElementById('sortNew').addEventListener('click', () => {
  sortNewest = true;
  document.getElementById('sortNew').classList.add('active');
  document.getElementById('sortOld').classList.remove('active');
  applyFilters();
});
document.getElementById('sortOld').addEventListener('click', () => {
  sortNewest = false;
  document.getElementById('sortOld').classList.add('active');
  document.getElementById('sortNew').classList.remove('active');
  applyFilters();
});
</script>
</body>
</html>
